# Railway config-as-code for the hosted service (dashboard + GitHub webhook).
# The service runs Dockerfile.server; the scanner image (Dockerfile) is not
# what should be listening on a port.
#
# Runtime variables (set in Railway, never here):
#   GITHUB_WEBHOOK_SECRET  enables POST /webhook
#   GITHUB_TOKEN           fetch PR diffs + post summary comments
#   RAILWAY_RUN_UID=0      required because the image runs as a non-root user
#                          and Railway mounts volumes as root
# Volume: mount at /data (XDG_STATE_HOME) so evolution.db survives deploys.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.server"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
