[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rushingtech-agents"
version = "2.12.0"
description = "OpenAI-compatible AI agents for solo full-stack operators — security audit, Stripe billing, Railway deploy, code review, and project scaffolding."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rushing Technologies", email = "nickrushing@rushingtechnologies.com" },
]
dependencies = [
  "openai>=1.50.0",
  "anthropic>=0.40.0",
  "PyYAML>=6.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "ruff",
]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
