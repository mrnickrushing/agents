services:
  agents:
    build:
      context: .
    image: rushingtech/agents:local
    volumes:
      - .:/app
    working_dir: /app
    command: ["scan", "--path", "/app", "--fail-on", "never"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: rushingtech/agents-server:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - agents-state:/data

volumes:
  agents-state:
