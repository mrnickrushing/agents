[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rushingtech-agents"
version = "2.15.0"
description = "AI agents for solo full-stack operators — security, billing, deploy, code review"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "RushingTech", email = "team@rushingtechnologies.com" },
]
keywords = ["agents", "security", "code-review", "ai", "llm"]
dependencies = [
  "openai>=1.50.0",
  "anthropic>=0.40.0",
  "PyYAML>=6.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software :: Quality Assurance",
]

[project.scripts]
agents = "agents.cli:main"

[project.urls]
Homepage = "https://github.com/mrnickrushing/agents"
Documentation = "https://github.com/mrnickrushing/agents#readme"
Repository = "https://github.com/mrnickrushing/agents"
Issues = "https://github.com/mrnickrushing/agents/issues"

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "ruff",
]
web = ["flask>=3.0.0"]

[tool.setuptools.packages.find]
include = ["agents*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841"]
